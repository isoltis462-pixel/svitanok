<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>СВІТАНОК — Інтернет-магазин дитячих товарів</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="header">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <span>СВІТАНОК</span>
      </a>
      <nav class="nav-menu">
        <a href="index.html" class="nav-link active">Головна</a>
        <a href="shop.html" class="nav-link">Магазин</a>
      </nav>
      <div class="header-actions">
        <button class="action-btn" id="theme-toggle"><i class="fa-solid fa-moon"></i></button>
        <a href="wishlist.html" class="action-btn"><i class="fa-regular fa-heart"></i><span class="badge-count" id="wishlist-count">0</span></a>
        <a href="cart.html" class="action-btn"><i class="fa-solid fa-bag-shopping"></i><span class="badge-count" id="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="container section">
    <h1>Ласкаво просимо до СВІТАНОК</h1>
    <p>Найкращі товари для ваших малюків з доставкою по Україні.</p>
    <a href="shop.html" class="btn-primary" style="margin-top: 20px; display: inline-block;">Перейти до каталогу</a>
  </main>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
